; DPT.PSP GTA Modding Kit - example configuration
; Copy to config.ini next to ModKit.exe (the tool creates one automatically).

[server]
webPort=44700
webPortFallbacks=44710,44720,44730
; 127.0.0.1 = local only, 0.0.0.0 = reachable from LAN (needed for team sessions)
bind=127.0.0.1
workers=2
maxConnections=64

[workspace]
; root folder for projects (created on demand)
root=workspace
; where extracted game dumps are looked up (ISO, IMG, DTZ ...)
gamesRoot=

[logging]
fileLevel=Verbose
consoleLevel=Info
directory=logs
webTailLines=300

[resilience]
retries=3
retryBaseMs=200
breakerThreshold=5
breakerCooldownSec=30
restartDelayMinMs=500
restartDelayMaxMs=30000

[limits]
maxUploadMb=512
maxJobHistory=200
maxOpsPerSession=5000

[session]
allowLan=true
opPollMs=800