; DPT.PSP GTA Modding Kit - example configuration
; Copy to config.ini next to ModKit.exe (the tool creates one automatically).

[server]
webPort=44700
webPortFallbacks=44710,44720,44730
; 0.0.0.0 = reachable from the LAN (phone, second PC, team sessions)
; 127.0.0.1 = this machine only
bind=0.0.0.0
workers=2
maxConnections=64

[workspace]
; root folder for projects (created on demand)
root=workspace
; where extracted game dumps are looked up (ISO, IMG, DTZ ...)
; it is also the second root the web UI may read from: "add folder to project"
; accepts paths only inside workspace\ and gamesRoot\.
; example: gamesRoot=E:\_DPT_Projects_E\_Harness\ModKitGTAPSP\refs\GAMES
gamesRoot=

[logging]
fileLevel=Verbose
consoleLevel=Info
directory=logs
webTailLines=300

[resilience]
retries=3
retryBaseMs=200
breakerThreshold=5
breakerCooldownSec=30
restartDelayMinMs=500
restartDelayMaxMs=30000

[limits]
maxUploadMb=512
maxJobHistory=200
maxOpsPerSession=5000

[session]
allowLan=true
opPollMs=800